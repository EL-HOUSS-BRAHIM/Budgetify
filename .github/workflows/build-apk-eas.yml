name: build-apk-eas

# Cloud release builds on Expo's infrastructure (EAS Build).
# Runner time stays near-zero: the compile happens on EAS workers, the job only
# waits for the result and re-uploads the artifact to the workflow run.
#
# Required secret: EXPO_TOKEN (Expo access token with build permissions).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile from apps/mobile/eas.json
        type: choice
        default: preview
        options:
          - preview
          - production-apk
          - production
          - development
      download:
        description: Download the artifact into the workflow run
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || 'preview' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROFILE: ${{ inputs.profile || 'preview' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Only the JS dependency graph is needed to submit the build; native deps
      # are resolved on the EAS worker.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: .

      - name: Link EAS project
        run: eas init --id 42f60197-f2b5-4b6a-a8a4-96e2af2ecf9a --force --non-interactive

      - name: Build on EAS
        id: eas
        run: |
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json > build.json
          echo "url=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.[0].id' build.json)" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        if: ${{ inputs.download != false && steps.eas.outputs.url != 'null' }}
        run: curl -fsSL -o "budgetify-${PROFILE}.apk" "${{ steps.eas.outputs.url }}"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.download != false && steps.eas.outputs.url != 'null' }}
        with:
          name: budgetify-${{ env.PROFILE }}-apk
          path: apps/mobile/budgetify-${{ env.PROFILE }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### EAS build \`$PROFILE\`"
            echo ""
            echo "- Build id: \`${{ steps.eas.outputs.id }}\`"
            echo "- Artifact: ${{ steps.eas.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
